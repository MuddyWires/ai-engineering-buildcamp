[project]
name = "ai-engineering-buildcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitsource>=0.0.5",
    "jaxn>=0.0.5",
    "minsearch>=0.2.0",
    "openai>=3.19.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
]

[project.scripts]
ai-engineering-buildcamp = "ai_engineering_buildcamp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
