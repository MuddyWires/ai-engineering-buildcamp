[project]
name = "documentation-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MuddyWires", email = "333025059+MuddyWires@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gitsource>=0.0.5",
    "jaxn>=0.0.5",
    "minsearch>=0.2.0",
    "openai>=3.35.1",
    "pydantic-ai>=2.57.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
documentation-agent = "documentation_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"

